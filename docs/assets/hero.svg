<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="398" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="28" y="40" font-size="20" font-weight="700" fill="#1f2328">local-jev</text>
  <text x="122" y="40" font-size="14" fill="#59636e">typed decisions from small open models, on your own machine</text>

  <!-- inputs -->
  <rect x="28" y="66" width="200" height="112" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="88" font-size="11" font-weight="700" fill="#59636e" letter-spacing="0.8">STATE</text>
  <text font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2328">
    <tspan x="42" y="110">"I've been trying to connect</tspan>
    <tspan x="42" y="126">my Stripe account for 3 days</tspan>
    <tspan x="42" y="142">and it keeps failing. I'm</tspan>
    <tspan x="42" y="158">losing sales. Help ASAP."</tspan>
  </text>

  <rect x="28" y="192" width="200" height="130" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="214" font-size="11" font-weight="700" fill="#59636e" letter-spacing="0.8">QUESTIONS</text>
  <text font-size="12" fill="#1f2328">
    <tspan x="42" y="238" font-weight="600">choice</tspan><tspan x="92" y="238" fill="#59636e">Which team handles it?</tspan>
    <tspan x="42" y="264" font-weight="600">score</tspan><tspan x="92" y="264" fill="#59636e">How frustrated?</tspan>
    <tspan x="42" y="290" font-weight="600">noul</tspan><tspan x="92" y="290" fill="#59636e">Is it urgent?</tspan>
  </text>
  <text x="42" y="310" font-size="10.5" fill="#59636e">evaluated independently, in one batch</text>

  <!-- core -->
  <rect x="268" y="66" width="264" height="256" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="90" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle" letter-spacing="0.8">POST /v1/systemone</text>

  <rect x="288" y="104" width="224" height="56" rx="8" fill="#ffffff" stroke="#0969da"/>
  <text x="400" y="127" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Backend</text>
  <text x="400" y="145" font-size="11" fill="#59636e" text-anchor="middle">the question, in the model's own idiom</text>

  <rect x="288" y="176" width="224" height="56" rx="8" fill="#ffffff" stroke="#0969da"/>
  <text x="400" y="199" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">A small open model</text>
  <text x="400" y="217" font-size="11" fill="#59636e" text-anchor="middle">a small LLM or an entailment model</text>

  <rect x="288" y="248" width="224" height="56" rx="8" fill="#ffffff" stroke="#0969da"/>
  <text x="400" y="271" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Primitives</text>
  <text x="400" y="289" font-size="11" fill="#59636e" text-anchor="middle">probabilities, expected score, confidence</text>

  <path d="M400,160 L400,174" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,232 L400,246" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M228,122 L266,122" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M228,257 L266,257" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M532,194 L570,194" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- outputs -->
  <rect x="572" y="66" width="200" height="256" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="586" y="88" font-size="11" font-weight="700" fill="#59636e" letter-spacing="0.8">TYPED ANSWERS</text>

  <text x="586" y="112" font-size="12" font-weight="600" fill="#1f2328">department: technical</text>
  <g font-size="10.5" fill="#59636e">
    <text x="586" y="130">technical</text><rect x="642" y="122" width="92" height="8" rx="4" fill="#0969da"/><text x="740" y="130">.79</text>
    <text x="586" y="146">billing</text><rect x="642" y="138" width="24" height="8" rx="4" fill="#80ccff"/><text x="740" y="146">.21</text>
    <text x="586" y="162">sales</text><rect x="642" y="154" width="3" height="8" rx="1.5" fill="#80ccff"/><text x="740" y="162">.00</text>
  </g>
  <text x="586" y="180" font-size="10.5" fill="#59636e">confidence 0.68</text>

  <line x1="586" y1="192" x2="758" y2="192" stroke="#d0d7de"/>
  <text x="586" y="214" font-size="12" font-weight="600" fill="#1f2328">frustration: 1.43</text>
  <text x="586" y="232" font-size="10.5" fill="#59636e">expected level, between 1 and 2</text>

  <line x1="586" y1="246" x2="758" y2="246" stroke="#d0d7de"/>
  <text x="586" y="268" font-size="12" font-weight="600" fill="#1f2328">is_urgent: 0.97</text>
  <text x="586" y="286" font-size="10.5" fill="#59636e">probability that the answer is yes</text>
  <text x="586" y="308" font-size="10" fill="#8c959f">illustrative values</text>

  <!-- footer -->
  <g font-size="12" fill="#1f2328">
    <circle cx="36" cy="358" r="4" fill="#0969da"/><text x="48" y="362">Runs fully offline</text>
    <circle cx="196" cy="358" r="4" fill="#0969da"/><text x="208" y="362">Jev wire format, official SDK works</text>
    <circle cx="452" cy="358" r="4" fill="#0969da"/><text x="464" y="362">No text generation, no parsing</text>
    <circle cx="664" cy="358" r="4" fill="#0969da"/><text x="676" y="362">Pluggable models</text>
  </g>
</svg>
